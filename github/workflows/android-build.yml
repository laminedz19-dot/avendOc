name: Android CI Build

# Builds the AchriDZ APK automatically on every push, and can also be
# triggered manually from the "Actions" tab on GitHub (workflow_dispatch).
on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # AGP 9 / Gradle 9 require JDK 17+
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      # This repo does not include gradlew / gradlew.bat / gradle-wrapper.jar.
      # If they are missing, generate them using the system Gradle that ships
      # on GitHub-hosted runners, matching the version pinned in
      # gradle/wrapper/gradle-wrapper.properties.
      - name: Ensure Gradle wrapper exists
        run: |
          if [ ! -f "./gradlew" ]; then
            echo "gradlew not found — generating the wrapper..."
            gradle wrapper --gradle-version 9.3.1
          else
            echo "gradlew already present, skipping."
          fi

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: achridz-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
