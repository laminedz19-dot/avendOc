name: Android Build & APK Release

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    name: Build Android App & Generate APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Create dummy .env file if missing
        run: |
          if [ ! -f .env ]; then
            echo 'GEMINI_API_KEY=""' > .env
          fi

      - name: Inject google-services.json from GitHub Secret (if present)
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -n "$GOOGLE_SERVICES_JSON" ]; then
            echo "$GOOGLE_SERVICES_JSON" > app/google-services.json
            echo "Successfully loaded google-services.json from GitHub Secret!"
          elif [ -f "app/google-services.json" ]; then
            echo "google-services.json is already committed in app/ folder."
          else
            echo "No google-services.json provided; app will build in offline/fallback mode safely."
          fi

      - name: Build Debug APK
        run: ./gradlew assembleDebug -x validateSigningDebug --stacktrace

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AchriDZ-Debug-APK
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 14
