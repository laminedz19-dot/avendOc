name: Admin App - Android APK

on:
  push:
    branches: ["main", "master"]
  pull_request:
    branches: ["main", "master"]
  workflow_dispatch:

jobs:
  build-admin:
    name: Build Admin APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: temurin
          cache: gradle

      - name: Grant execute permission for admin gradlew
        run: chmod +x admin-app/gradlew

      - name: Prepare admin debug keystore
        run: cp debug.keystore admin-app/debug.keystore

      - name: Create admin .env file if missing
        working-directory: admin-app
        run: |
          if [ ! -f .env ]; then
            echo 'GEMINI_API_KEY=CI_PLACEHOLDER' > .env
          fi

      - name: Inject admin google-services.json from GitHub Secret (if present)
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -n "$GOOGLE_SERVICES_JSON" ]; then
            echo "$GOOGLE_SERVICES_JSON" > admin-app/app/google-services.json
          elif [ -f "admin-app/app/google-services.json" ]; then
            echo "Using committed admin app google-services.json."
          elif [ -f "app/google-services.json" ]; then
            cp app/google-services.json admin-app/app/google-services.json
            echo "Using the shared Firebase configuration; Gradle will select com.avendoc.admin."
          else
            echo "No google-services.json provided for admin app."
            exit 1
          fi

      - name: Validate Firebase configuration
        working-directory: admin-app
        run: ./gradlew :app:validateGoogleServices --stacktrace --no-configuration-cache

      - name: Build Admin Debug APK
        working-directory: admin-app
        run: ./gradlew assembleDebug -x validateSigningDebug --stacktrace --no-configuration-cache

      - name: Upload Admin Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: AchriDZ-Admin-Debug-APK
          path: admin-app/app/build/outputs/apk/debug/*.apk
          retention-days: 14
