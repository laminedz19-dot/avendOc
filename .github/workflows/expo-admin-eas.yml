name: Expo Admin - EAS Android Build

on:
  push:
    branches: ["main", "master"]
    paths:
      - "expo-admin/**"
      - ".github/workflows/expo-admin-eas.yml"
  workflow_dispatch:
    inputs:
      profile:
        description: "EAS build profile"
        required: true
        default: preview
        type: choice
        options:
          - preview
          - production

permissions:
  contents: read

concurrency:
  group: expo-admin-eas-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build Admin Android app with EAS
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: expo-admin
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: npm
          cache-dependency-path: expo-admin/package-lock.json

      - name: Setup Expo and EAS CLI
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}
          packager: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate Expo project linkage
        run: |
          node -e "const c=require('./app.json').expo; if (!c.extra?.eas?.projectId) { console.error('Missing expo.extra.eas.projectId. Run npx eas init locally once and commit app.json.'); process.exit(1); }"
          npx tsc --noEmit

      - name: Trigger EAS Android build
        run: eas build --platform android --profile "${{ inputs.profile || 'preview' }}" --non-interactive --no-wait
