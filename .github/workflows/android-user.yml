name: User App - Android APK

on:
  push:
    branches: ["main", "master"]
  pull_request:
    branches: ["main", "master"]
  workflow_dispatch:

jobs:
  build-user:
    name: Build User APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: temurin
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Create .env file if missing
        run: |
          if [ ! -f .env ]; then
            echo 'GEMINI_API_KEY=CI_PLACEHOLDER' > .env
          fi

      - name: Inject google-services.json from GitHub Secret (if present)
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -n "$GOOGLE_SERVICES_JSON" ]; then
            echo "$GOOGLE_SERVICES_JSON" > app/google-services.json
          elif [ -f "app/google-services.json" ]; then
            echo "Using committed user app google-services.json."
          else
            echo "No google-services.json provided."
            exit 1
          fi

      - name: Validate Firebase configuration
        run: ./gradlew :app:validateGoogleServices --stacktrace --no-configuration-cache

      - name: Build User Debug APK
        run: ./gradlew assembleDebug -x validateSigningDebug --stacktrace --no-configuration-cache

      - name: Upload User Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: AchriDZ-User-Debug-APK
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 14
